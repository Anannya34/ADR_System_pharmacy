<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drug Interaction Awareness Tool</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>💊 Drug Interaction Awareness Tool</h1>
    <p>Public-safety information only — not a medical decision system</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>Select Medicines</h2>
      <div class="selector">
        <select id="drugA">
          <option value="">Select first medicine</option>
          <option>Paracetamol</option>
          <option>Ibuprofen</option>
          <option>Aspirin</option>
          <option>Metformin</option>
          <option>Amlodipine</option>
          <option>Atenolol</option>
          <option>Amoxicillin</option>
        </select>
        <select id="drugB">
          <option value="">Select second medicine</option>
          <option>Paracetamol</option>
          <option>Ibuprofen</option>
          <option>Aspirin</option>
          <option>Metformin</option>
          <option>Amlodipine</option>
          <option>Atenolol</option>
          <option>Amoxicillin</option>
        </select>
      </div>
      <button onclick="checkInteraction()">Check Interaction</button>
    </div>

    <div id="output"></div>

  </div>

  <footer>
    ⚠️ Disclaimer: This tool is for awareness only. Always consult a doctor or pharmacist.
  </footer>

  <script src="script.js" defer></script>

</body>

</html>
