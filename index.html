<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Drug Interaction Awareness Tool | ARD System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>💊 Interaction Aware</h1>
    <div class="disclaimer-pill">Public safety information • Not medical advice</div>
  </header>

  <div class="container">

    <div class="card">
      <h2>Check Medicine Safety</h2>
      <div class="selector-group">
        <div class="selector">
          <div class="dropdown-container">
            <label class="dropdown-label">First Medicine</label>
            <select id="drugA">
              <option value="">Select medicine...</option>
              <option>Paracetamol</option>
              <option>Ibuprofen</option>
              <option>Aspirin</option>
              <option>Metformin</option>
              <option>Amlodipine</option>
              <option>Atenolol</option>
              <option>Amoxicillin</option>
            </select>
          </div>
          <div class="dropdown-container">
            <label class="dropdown-label">Second Medicine</label>
            <select id="drugB">
              <option value="">Select medicine...</option>
              <option>Paracetamol</option>
              <option>Ibuprofen</option>
              <option>Aspirin</option>
              <option>Metformin</option>
              <option>Amlodipine</option>
              <option>Atenolol</option>
              <option>Amoxicillin</option>
            </select>
          </div>
        </div>
        <button onclick="checkInteraction()">Compare Interactions</button>
      </div>
    </div>

    <div id="output"></div>

  </div>

  <footer>
    ⚠️ Disclaimer: This tool is for awareness only. Always consult a doctor or pharmacist.
  </footer>

  <script src="script.js" defer></script>

</body>

</html>
